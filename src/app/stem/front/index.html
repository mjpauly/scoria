<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0">
        <link rel="stylesheet" href="tailwind.css"/>
        <script type="module">
            import init from "/front_wasm.js";
            init();
        </script>
        <script>
            // poke() sends a simple message to the swift webkit message handler
            // we created. This prompts it to load new configuration settings
            // from the backend.
            function webkit_poke() {
                window.webkit.messageHandlers.pokeMessageHandler.postMessage({
                    "message": "poke"
                });
            }
        </script>
        <script src="https://cdn.plot.ly/plotly-2.18.2.min.js"></script>
    </head>
</html>
