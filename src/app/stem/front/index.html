<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, viewport-fit=cover">
        <script type="module" nonce="RANDOM_NONCE"> 
            import init from "./front_wasm.js";
            init();
        </script>
        <script nonce="RANDOM_NONCE">
            // poke() sends a simple message to the swift webkit message handler
            // we created. This prompts it to load new configuration settings
            // from the backend.
            function webkit_poke() {
                try {
                    window.webkit.messageHandlers.pokeMessageHandler.postMessage({
                        "message": "poke"
                    });
                } catch (error) {
                    try {
                        Android.poke();
                    } catch (error) {
                        console.log("Failed to execute poke.");
                    }
                }
            }
            // Fire-and-forget haptic feedback in the native layer. Silently
            // does nothing in a plain browser; kinds are "prepare", "tick",
            // and "hold".
            function native_haptic(kind) {
                try {
                    window.webkit.messageHandlers.hapticMessageHandler.postMessage({
                        "kind": kind
                    });
                } catch (error) {
                    try {
                        Android.haptic(kind);
                    } catch (error) {}
                }
            }
        </script>
        <script src="./plotly.min.js"></script>
        <script src='./maplibre-gl.js'></script>
        <link href='./maplibre-gl.css' rel='stylesheet' />
        <link rel="stylesheet" href="tailwind.css"/>
    </head>
</html>
