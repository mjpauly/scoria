<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, viewport-fit=cover">
        <script type="module">
            import init from "./front_wasm.js";
            init();
        </script>
        <script>
            // poke() sends a simple message to the swift webkit message handler
            // we created. This prompts it to load new configuration settings
            // from the backend.
            function webkit_poke() {
                try {
                    window.webkit.messageHandlers.pokeMessageHandler.postMessage({
                        "message": "poke"
                    });
                } catch (error) {
                    console.log("Failed to execute swift poke.");
                }
            }
        </script>
        <script src="./plotly.min.js"></script>
        <script src='./maplibre-gl.js'></script>
        <link href='./maplibre-gl.css' rel='stylesheet' />
        <link rel="stylesheet" href="tailwind.css"/>
    </head>
</html>
