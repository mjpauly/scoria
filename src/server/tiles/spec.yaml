alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
ingress:
  rules:
  - component:
      name: tileserver
    match:
      path:
        prefix: /
    cors:
      allow_origins:
      - regex: ".*"
name: gumball
region: sfo
services:
- http_port: 3000
  image:
    deploy_on_push:
      enabled: true
    registry_type: DOCR
    repository: tileserver
    tag: latest
  instance_count: 1
  instance_size_slug: basic-xxs
  name: tileserver
