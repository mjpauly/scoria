                    <h1>Contact</h1>
                    <p>
                        Use this form to get in touch with us. If you'd like to
                        receive a response, add your email.
                    </p>
                    <form class="mt-4" method="post">
                        <label for="subject" class="mt-2 block">
                            <span class="font-bold">Subject</span>
                            <input type="text" id="subject" name="subject"
                                required class="block w-full rounded-md
                                bg-neutral-800 px-2 py-0.5 text-neutral-300">
                        </label>

                        <label for="body" class="mt-2 block">
                            <span class="font-bold">Body</span>
                            <textarea id="body" name="body" required
                                class="block w-full h-20 rounded-md
                                bg-neutral-800 px-2 py-0.5 text-neutral-300
                                "></textarea>
                        </label>

                        <label for="email" class="mt-2 block">
                            <span class="font-bold">Email (optional)</span>
                            <input type="text" id="email" name="email"
                                class="block rounded-md bg-neutral-800 px-2
                                py-0.5 text-neutral-300">
                        </label>

                        <input type="submit" value="Submit"
                            class="mt-4 rounded-lg bg-neutral-600 px-4 py-2
                            ">
                    </form>
