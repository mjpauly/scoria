name: website
region: sfo
services:
  - name: website
    dockerfile_path: Dockerfile
    source_dir: .
    github:
      branch: main
      deploy_on_push: true
      repo: mjpauly/epsilon_website
    health_check:
      http_path: /health_check
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: APP_DATABASE__USERNAME
        scope: RUN_TIME
        value: ${feedback.USERNAME}
      - key: APP_DATABASE__PASSWORD
        scope: RUN_TIME
        value: ${feedback.PASSWORD}
      - key: APP_DATABASE__HOST
        scope: RUN_TIME
        value: ${feedback.HOSTNAME}
      - key: APP_DATABASE__PORT
        scope: RUN_TIME
        value: ${feedback.PORT}
      - key: APP_DATABASE__DATABASE_NAME
        scope: RUN_TIME
        value: ${feedback.DATABASE}
      # We use DO's APP_URL to inject the dynamically
      # provisioned base url as an environment variable
      - key: APP_APPLICATION__BASE_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: APP_ENVIRONMENT
        scope: RUN_TIME
        value: production
domains:
- domain: epsln.com
  type: PRIMARY
  zone: epsln.com
- domain: www.epsln.com
  type: ALIAS
  zone: epsln.com
databases:
  - engine: PG
    name: feedback
    num_nodes: 1
    size: db-s-dev-database
    version: "12"
